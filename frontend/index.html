<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>WarOfChronos</title>

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="static/css/chronos.css">

</head>

<body>

<div id="notice-container"></div>

<div id="room-modal" class="room-modal">
    <div class="room-card">

        <h2>WAR OF CHRONOS</h2>

        <p>房间已创建</p>

        <div id="room-id" class="room-id"></div>

        <p class="hint">点击复制房间号</p>

        <p>等待玩家加入中……</p>
    </div>
</div>
<div id="join-room-modal" class="room-modal">
    <div class="room-card">

        <h2>JOIN WAR</h2>

        <p>请输入房间号</p>

        <input id="join-room-id" type="text" class="room-id-input" placeholder="房间号">

        <button id="join-room-confirm-button" class="wc-button modal-button mt-3">
            ▷ 加入房间
        </button>

    </div>
</div>
<div id="exit-game-modal" class="room-modal">
    <div class="room-card">

        <h2>对方已退出战斗</h2>

        <button id="return-menu-button" class="wc-button modal-button mt-3">
            ▷ 返回首页
        </button>

    </div>
</div>
<div id="menu" class="container-fluid vh-100 d-flex 
justify-content-center align-items-center">


    <div class="chronos-panel text-center">


        <h1 class="title">
            WAR
            <span>OF</span>
            CHRONOS
        </h1>


        <p class="subtitle">
            时序战争
        </p>
        <div class="d-grid gap-3 mt-5">


            <button id="start-room-button" class="wc-button menu-button">
                ▷ 开始战争
            </button>

            <button id="join-room-button" class="wc-button menu-button">
                ▷ 加入战争
            </button>


            <button id="settings-button" class="wc-button menu-button">
                ▷ 设置
            </button>


        </div>

    </div>

</div>
<div id="game" class="container-fluid vh-100 d-flex justify-content-center align-items-center hidden">
    <div class="chronos-panel text-center">
        <h1 class="title">
            游戏界面
        </h1>
        <p class="subtitle">
            游戏已开始
        </p>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="static/js/notice.js"></script>
<script src="static/js/room-ui.js"></script>
<script src="static/js/main.js"></script>

</body>
</html>
