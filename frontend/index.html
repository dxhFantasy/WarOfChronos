<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>WarOfChronos</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet" href="static/css/chronos.css">


</head>


<body>

<div id="notice-container"></div>

<div class="container-fluid vh-100 d-flex 
justify-content-center align-items-center">


    <div class="chronos-panel text-center">


        <h1 class="title">
            WAR
            <span>OF</span>
            CHRONOS
        </h1>


        <p class="subtitle">
            时序战争
        </p>
        <div class="d-grid gap-3 mt-5">


            <button id="start-room-button" class="wc-button">
                ▷ 开始战争
            </button>

            <button id="join-room-button" class="wc-button">
                ▷ 加入战争
            </button>


            <button id="settings-button" class="wc-button">
                ▷ 设置
            </button>


        </div>

    </div>



</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="static/js/main.js"></script>


</body>


</html>
